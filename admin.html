<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SALWA APP</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        header h1 { font-size: 2em; margin-bottom: 10px; }
        .auth-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        .auth-section input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }
        .btn {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            margin: 5px;
        }
        .btn-success { background: #28a745; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            border-left: 5px solid #667eea;
        }
        .stat-card h3 { color: #666; font-size: 0.9em; margin-bottom: 10px; }
        .stat-number { font-size: 2.5em; font-weight: bold; color: #333; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Admin Dashboard SALWA APP</h1>
            <p>Monitor aktivitas chat dan pengguna</p>
        </header>

        <div class="auth-section">
            <h2>🔐 Konfigurasi Google Analytics 4</h2>
            <p>Masukkan kredensial untuk melihat analytics.</p>
            <input type="text" id="propertyId" placeholder="Property ID: properties/123456789">
            <input type="text" id="accessToken" placeholder="Access Token">
            <button class="btn btn-success" onclick="alert('Fitur admin akan aktif setelah setup GA4')">Simpan & Load Data</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>👥 Pengguna Aktif</h3>
                <div class="stat-number">-</div>
            </div>
            <div class="stat-card">
                <h3>💬 Pesan Terkirim</h3>
                <div class="stat-number">-</div>
            </div>
            <div class="stat-card">
                <h3>📊 Sesi Hari Ini</h3>
                <div class="stat-number">-</div>
            </div>
        </div>
    </div>
</body>
</html>
