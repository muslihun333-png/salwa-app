<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Salwa App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Login Form */
        .login-container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            max-width: 400px;
            margin: 100px auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .login-container h2 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #5568d3;
        }

        .btn-danger {
            background: #e74c3c;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-success {
            background: #27ae60;
        }

        .btn-success:hover {
            background: #229954;
        }

        .btn-warning {
            background: #f39c12;
        }

        .btn-warning:hover {
            background: #d68910;
        }

        /* Dashboard */
        .dashboard {
            display: none;
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .header h1 {
            color: #667eea;
        }

        .logout-btn {
            background: #e74c3c;
            padding: 8px 20px;
            border-radius: 8px;
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            color: #999;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }

        .panel {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .panel h3 {
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .user-list, .message-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .user-item, .message-item {
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-item:hover, .message-item:hover {
            background: #f8f9fa;
        }

        .user-info, .message-info {
            flex: 1;
        }

        .user-name {
            font-weight: 600;
            color: #333;
        }

        .user-status {
            font-size: 12px;
            color: #27ae60;
        }

        .user-status.blocked {
            color: #e74c3c;
        }

        .message-text {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }

        .message-time {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
        }

        .action-btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 12px;
            margin-left: 5px;
        }

        .action-btn.block {
            background: #e74c3c;
            color: white;
        }

        .action-btn.unblock {
            background: #27ae60;
            color: white;
        }

        .action-btn.delete {
            background: #e74c3c;
            color: white;
        }

        .textarea-group {
            margin-bottom: 15px;
        }

        .textarea-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            resize: vertical;
            min-height: 100px;
        }

        .textarea-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Form -->
        <div class="login-container" id="loginForm">
            <h2>🔐 Admin Login</h2>
            <div id="loginAlert" class="alert"></div>
            <form id="loginFormEl">
                <div class="form-group">
                    <label for="password">Password Admin</label>
                    <input type="password" id="password" placeholder="Masukkan password" required>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
            <p style="text-align: center; margin-top: 20px; color: #999;">
                <a href="index.html" style="color: #667eea;">← Kembali ke Chat</a>
            </p>
        </div>

        <!-- Dashboard -->
        <div class="dashboard" id="dashboard">
            <div class="header">
                <h1>🎯 Dashboard Admin - Salwa App</h1>
                <a href="#" class="logout-btn" onclick="logout()">Logout</a>
            </div>

            <div id="dashboardAlert" class="alert"></div>

            <!-- Statistics -->
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Pengguna</h3>
                    <div class="number" id="totalUsers">0</div>
                </div>
                <div class="stat-card">
                    <h3>Pesan Aktif</h3>
                    <div class="number" id="totalMessages">0</div>
                </div>
                <div class="stat-card">
                    <h3>Pengguna Diblokir</h3>
                    <div class="number" id="blockedUsers">0</div>
                </div>
            </div>

            <div class="content-grid">
                <!-- User Management -->
                <div class="panel">
                    <h3>👥 Manajemen Pengguna</h3>
                    <div class="user-list" id="userList">
                        <p style="color: #999; text-align: center;">Memuat data pengguna...</p>
                    </div>
                </div>

                <!-- Message Management -->
                <div class="panel">
                    <h3>💬 Manajemen Pesan</h3>
                    <div class="message-list" id="messageList">
                        <p style="color: #999; text-align: center;">Memuat data pesan...</p>
                    </div>
                    <button class="btn btn-danger" onclick="deleteAllMessages()" style="margin-top: 15px;">
                        🗑️ Hapus Semua Pesan
                    </button>
                </div>

                <!-- Broadcast -->
                <div class="panel">
                    <h3>📢 Broadcast Pesan</h3>
                    <div class="textarea-group">
                        <textarea id="broadcastMessage" placeholder="Tulis pesan broadcast untuk semua pengguna..."></textarea>
                    </div>
                    <button class="btn btn-success" onclick="sendBroadcast()">
                        📢 Kirim Broadcast
                    </button>
                </div>

                <!-- Settings -->
                <div class="panel">
                    <h3>⚙️ Pengaturan</h3>
                    <div class="form-group">
                        <label for="newPassword">Ganti Password Admin</label>
                        <input type="password" id="newPassword" placeholder="Password baru">
                    </div>
                    <button class="btn btn-warning" onclick="changePassword()">
                        🔑 Update Password
                    </button>
                    <button class="btn btn-danger" onclick="resetAllData()" style="margin-top: 15px;">
                        ⚠️ Reset Semua Data
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Konfigurasi
        const ADMIN_PASSWORD_KEY = 'salwa_admin_password';
        const USERS_KEY = 'salwa_users';
        const MESSAGES_KEY = 'salwa_messages';
        const BLOCKED_USERS_KEY = 'salwa_blocked_users';

        // Password default
        const DEFAULT_PASSWORD = 'SalwaAdmin2026';

        // Inisialisasi password jika belum ada
        if (!localStorage.getItem(ADMIN_PASSWORD_KEY)) {
            localStorage.setItem(ADMIN_PASSWORD_KEY, DEFAULT_PASSWORD);
        }

        // Check login status
        let isLoggedIn = false;

        // Login Form Handler
        document.getElementById('loginFormEl').addEventListener('submit', function(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const storedPassword = localStorage.getItem(ADMIN_PASSWORD_KEY);

            if (password === storedPassword) {
                isLoggedIn = true;
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                loadDashboard();
            } else {
                showAlert('loginAlert', 'Password salah!', 'error');
            }
        });

        // Logout
        function logout() {
            isLoggedIn = false;
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('password').value = '';
        }

        // Load Dashboard Data
        function loadDashboard() {
            loadStats();
            loadUsers();
            loadMessages();
        }

        // Load Statistics
        function loadStats() {
            const users = JSON.parse(localStorage.getItem(USERS_KEY) || '[]');
            const messages = JSON.parse(localStorage.getItem(MESSAGES_KEY) || '[]');
            const blocked = JSON.parse(localStorage.getItem(BLOCKED_USERS_KEY) || '[]');

            document.getElementById('totalUsers').textContent = users.length;
            document.getElementById('totalMessages').textContent = messages.length;
            document.getElementById('blockedUsers').textContent = blocked.length;
        }

        // Load Users
        function loadUsers() {
            const users = JSON.parse(localStorage.getItem(USERS_KEY) || '[]');
            const blocked = JSON.parse(localStorage.getItem(BLOCKED_USERS_KEY) || '[]');
            const userList = document.getElementById('userList');

            if (users.length === 0) {
                userList.innerHTML = '<p style="color: #999; text-align: center;">Belum ada pengguna</p>';
                return;
            }

            userList.innerHTML = users.map(user => {
                const isBlocked = blocked.includes(user.username);
                return `
                    <div class="user-item">
                        <div class="user-info">
                            <div class="user-name">${escapeHtml(user.username)}</div>
                            <div class="user-status ${isBlocked ? 'blocked' : ''}">
                                ${isBlocked ? '🚫 Diblokir' : '✅ Aktif'}
                            </div>
                        </div>
                        <button class="action-btn ${isBlocked ? 'unblock' : 'block'}" 
                                onclick="toggleBlockUser('${escapeHtml(user.username)}')">
                            ${isBlocked ? 'Buka Blokir' : 'Blokir'}
                        </button>
                    </div>
                `;
            }).join('');
        }

        // Load Messages
        function loadMessages() {
            const messages = JSON.parse(localStorage.getItem(MESSAGES_KEY) || '[]');
            const messageList = document.getElementById('messageList');

            if (messages.length === 0) {
                messageList.innerHTML = '<p style="color: #999; text-align: center;">Belum ada pesan</p>';
                return;
            }

            // Show last 20 messages
            const recentMessages = messages.slice(-20).reverse();

            messageList.innerHTML = recentMessages.map(msg => `
                <div class="message-item">
                    <div class="message-info">
                        <div class="user-name">${escapeHtml(msg.username)}</div>
                        <div class="message-text">${escapeHtml(msg.text)}</div>
                        <div class="message-time">${new Date(msg.timestamp).toLocaleString('id-ID')}</div>
                    </div>
                    <button class="action-btn delete" onclick="deleteMessage(${msg.id})">
                        🗑️ Hapus
                    </button>
                </div>
            `).join('');
        }

        // Toggle Block User
        function toggleBlockUser(username) {
            let blocked = JSON.parse(localStorage.getItem(BLOCKED_USERS_KEY) || '[]');

            if (blocked.includes(username)) {
                blocked = blocked.filter(u => u !== username);
                showAlert('dashboardAlert', `Pengguna ${username} tidak diblokir lagi`, 'success');
            } else {
                blocked.push(username);
                showAlert('dashboardAlert', `Pengguna ${username} telah diblokir`, 'success');
            }

            localStorage.setItem(BLOCKED_USERS_KEY, JSON.stringify(blocked));
            loadDashboard();
        }

        // Delete Single Message
        function deleteMessage(messageId) {
            let messages = JSON.parse(localStorage.getItem(MESSAGES_KEY) || '[]');
            messages = messages.filter(msg => msg.id !== messageId);
            localStorage.setItem(MESSAGES_KEY, JSON.stringify(messages));
            showAlert('dashboardAlert', 'Pesan berhasil dihapus', 'success');
            loadDashboard();
        }

        // Delete All Messages
        function deleteAllMessages() {
            if (confirm('Yakin ingin menghapus SEMUA pesan?')) {
                localStorage.setItem(MESSAGES_KEY, '[]');
                showAlert('dashboardAlert', 'Semua pesan berhasil dihapus', 'success');
                loadDashboard();
            }
        }

        // Send Broadcast
        function sendBroadcast() {
            const message = document.getElementById('broadcastMessage').value.trim();

            if (!message) {
                showAlert('dashboardAlert', 'Pesan broadcast tidak boleh kosong', 'error');
                return;
            }

            // Add broadcast message to chat
            let messages = JSON.parse(localStorage.getItem(MESSAGES_KEY) || '[]');
            messages.push({
                id: Date.now(),
                username: '📢 ADMIN',
                text: message,
                timestamp: new Date().toISOString(),
                isBroadcast: true
            });
            localStorage.setItem(MESSAGES_KEY, JSON.stringify(messages));

            document.getElementById('broadcastMessage').value = '';
            showAlert('dashboardAlert', 'Broadcast berhasil dikirim', 'success');
            loadDashboard();
        }

        // Change Password
        function changePassword() {
            const newPassword = document.getElementById('newPassword').value.trim();

            if (!newPassword) {
                showAlert('dashboardAlert', 'Password baru tidak boleh kosong', 'error');
                return;
            }

            if (newPassword.length < 6) {
                showAlert('dashboardAlert', 'Password minimal 6 karakter', 'error');
                return;
            }

            localStorage.setItem(ADMIN_PASSWORD_KEY, newPassword);
            document.getElementById('newPassword').value = '';
            showAlert('dashboardAlert', 'Password berhasil diubah', 'success');
        }

        // Reset All Data
        function resetAllData() {
            if (confirm('⚠️ PERINGATAN: Ini akan menghapus SEMUA data (pengguna, pesan, blokir). Yakin?')) {
                localStorage.setItem(USERS_KEY, '[]');
                localStorage.setItem(MESSAGES_KEY, '[]');
                localStorage.setItem(BLOCKED_USERS_KEY, '[]');
                showAlert('dashboardAlert', 'Semua data berhasil direset', 'success');
                loadDashboard();
            }
        }

        // Show Alert
        function showAlert(elementId, message, type) {
            const alert = document.getElementById(elementId);
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';

            setTimeout(() => {
                alert.style.display = 'none';
            }, 3000);
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Auto refresh dashboard every 10 seconds
        setInterval(() => {
            if (isLoggedIn) {
                loadDashboard();
            }
        }, 10000);
    </script>
</body>
</html>
